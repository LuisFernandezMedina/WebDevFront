

<div class="tab-selector">
    <button [class.active-tab]="selectedTab === 'find'" (click)="selectTab('find')">Find</button>

</div>

<div *ngIf="selectedTab === 'find'">

    <div class="search-filter-container">
    
        <div class="filter-options">
        
            <div class="filter-left">
                <label for="search-by">Search by :</label>
                <select id="search-by" [(ngModel)]="searchBy">
                <option value="name">Name</option>
                <option value="email">Email</option>
                </select>
            </div>
        
            <div class="filter-center">
                <input type="text" id="search-input" placeholder="Search" [(ngModel)]="searchQuery">
            </div>
        
            </div>
        </div>
        
    
    
        <!-- Lista de usuarios -->
        <div class="center-container">
        <div class="user-list-container">
            <div class="user-list-header">
            <span class="column-header">Full Name</span>
            <span class="column-header">Email</span>
            <span class="column-header">Actions</span>
            </div>
    
            <div class="user-list-content">
            <div *ngFor="let user of filteredUsers" class="user-list-row">
                <div class="user-data">{{ user.name }}</div>
                <div class="user-data">{{ user.email }}</div>

                <div class="user-actions">
                    <!-- Botón EDITAR -->
                    <button class="action-btn edit-btn" title="Edit User" (click)="editUser(user.id)">
                        <i class="material-icons">edit</i>
                    </button>
  
                    
                    <!-- Botón ELIMINAR -->
                    <button class="action-btn delete-btn" title="Delete User" (click)="deleteUser(user)">
                        <i class="material-icons">delete</i>
                    </button>
                  </div>
                  
            </div>
        </div>
        </div>
    </div>
    <div *ngIf="showDeleteModal"class="delete-modal">
          <i class="material-icons warning-icon">warning</i>
          <h3>Confirm Delete</h3>
          <p class="warning-text">Are you sure you want to delete this user? This action cannot be undone.</p>
          <div class="modal-actions">
            <button class="confirm-btn" (click)="confirmDelete()">Yes, Delete</button>
            <button class="cancel-btn" (click)="showDeleteModal = false">Cancel</button>
          </div>
      </div>
